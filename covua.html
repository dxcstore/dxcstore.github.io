<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cờ Vua Online - Chess.com Style</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0; min-height: 100vh;
    background: #161512; color: #bababa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px;
  }

  /* Màn hình nhập tên */
  #name-modal {
    position: fixed; inset: 0; z-index: 99999;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-card {
    background: #262421; border: 1px solid #3c3935; border-radius: 12px;
    padding: 24px; width: min(380px, 90vw); text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .modal-card h2 { color: #fff; margin-top: 0; font-size: 20px; }
  .modal-card input {
    width: 100%; padding: 10px 14px; border-radius: 6px;
    border: 1px solid #4a4743; background: #1e1c19; color: #fff;
    font-size: 15px; margin: 14px 0; outline: none; text-align: center;
  }
  .modal-card button {
    width: 100%; padding: 11px; border-radius: 6px; border: 0;
    background: #81b64c; color: #fff; font-weight: bold; font-size: 15px;
    cursor: pointer; transition: background 0.2s;
  }
  .modal-card button:hover { background: #73a83d; }

  .main-container {
    display: flex; gap: 20px; max-width: 1040px; width: 100%;
    align-items: center; justify-content: center; flex-wrap: wrap;
  }

  /* Bàn cờ */
  .board-container {
    background: #262421; padding: 10px; border-radius: 8px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
  }
  .board {
    display: grid; grid-template-columns: repeat(8, 1fr);
    width: min(540px, 90vw); height: min(540px, 90vw);
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .square {
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
  }
  .light { background: #eeeed2; }
  .dark { background: #769656; }
  
  /* Quân cờ chiếm trọn ô vuông, to rõ và sắc nét */
  .piece {
    position: absolute; inset: 4px; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  .piece svg { width: 100%; height: 100%; display: block; }

  .selected { background: #baca44 !important; }
  .last-move { background: rgba(245, 246, 130, 0.6) !important; }
  
  .hint::after {
    content: ""; width: 34%; height: 34%; background: rgba(0, 0, 0, 0.25); border-radius: 50%; position: absolute; z-index: 4;
  }
  .hint-capture::after {
    content: ""; width: 92%; height: 92%; border: 6px solid rgba(0, 0, 0, 0.25); border-radius: 50%; position: absolute; box-sizing: border-box; z-index: 4;
  }
  .in-check { background: radial-gradient(circle, #ff4757 30%, transparent 80%) !important; }

  /* Thanh bên */
  .sidebar {
    width: min(360px, 90vw); background: #262421; border-radius: 8px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .player-info {
    display: flex; justify-content: space-between; align-items: center;
    background: #1e1c19; padding: 8px 12px; border-radius: 6px; color: #fff; font-weight: bold; font-size: 13px;
  }
  .timer { background: #111; padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 14px; color: #fff; }
  .status-text { font-size: 12px; color: #989795; text-align: center; }

  .time-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .time-btn {
    background: #3c3935; border: 1px solid transparent; color: #fff; padding: 8px; border-radius: 6px;
    font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.15s;
  }
  .time-btn:hover { background: #4a4743; }
  .time-btn.active { background: #81b64c; border-color: #95cb5c; }

  .menu-group { display: flex; flex-direction: column; gap: 6px; }
  .btn-chess {
    padding: 9px; border-radius: 6px; border: 0; font-weight: bold; font-size: 13px;
    cursor: pointer; text-align: center; color: #fff; transition: 0.15s;
  }
  .btn-bot { background: #3b82f6; }
  .btn-bot:hover { background: #2563eb; }
  .btn-quick { background: #f59e0b; color: #111; }
  .btn-quick:hover { background: #d97706; }
  .btn-green { background: #81b64c; }
  .btn-green:hover { background: #73a83d; }
  .btn-gray { background: #3c3935; }
  .btn-gray:hover { background: #4a4743; }
  .btn-red { background: #ef4444; }
  .btn-red:hover { background: #dc2626; }

  .row-input { display: flex; gap: 6px; }
  .row-input input {
    flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #4a4743;
    background: #1e1c19; color: #fff; font-size: 12px; outline: none;
  }
</style>
</head>
<body>

  <!-- Màn hình nhập tên -->
  <div id="name-modal">
    <div class="modal-card">
      <h2>♟️ Cờ Vua Online</h2>
      <p style="font-size: 13px; color: #989795;">Nhập tên của bạn để bắt đầu:</p>
      <input type="text" id="input-name" placeholder="Tên kỳ thủ..." maxlength="15">
      <button onclick="saveNameAndStart()">Vào chơi</button>
    </div>
  </div>

  <div class="main-container">
    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <div class="sidebar">
      <!-- Đối thủ -->
      <div class="player-info">
        <span id="opponent-name">🤖 Bot thông minh</span>
        <span class="timer" id="black-timer">3:00</span>
      </div>

      <div class="status-text" id="status">Chọn thời gian và chế độ đấu!</div>

      <!-- Người chơi -->
      <div class="player-info">
        <span id="my-display-name">👤 Kỳ thủ</span>
        <span class="timer" id="white-timer">3:00</span>
      </div>

      <!-- Chọn thời gian -->
      <div style="font-size: 12px; font-weight: bold; color:#fff; margin-top: 2px;">⏱️ Chọn thời gian:</div>
      <div class="time-modes">
        <button class="time-btn" onclick="setTimeMode(1, 0, this)">1 phút</button>
        <button class="time-btn" onclick="setTimeMode(2, 1, this)">2+1</button>
        <button class="time-btn active" onclick="setTimeMode(3, 2, this)">3+2</button>
        <button class="time-btn" onclick="setTimeMode(5, 0, this)">5 phút</button>
        <button class="time-btn" onclick="setTimeMode(10, 0, this)">10 phút</button>
        <button class="time-btn" onclick="setTimeMode(15, 10, this)">15+10</button>
      </div>

      <div class="menu-group" style="margin-top: 4px;">
        <button class="btn-chess btn-bot" onclick="startBotMode()">🤖 Đấu với Bot</button>
        <button class="btn-chess btn-quick" onclick="startQuickMatch()">⚡ Ghép trận nhanh</button>
      </div>

      <div class="menu-group" style="background: #1e1c19; padding: 8px; border-radius: 6px;">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 6px; color:#fff;">🔑 Chơi với bạn bè:</div>
        <div class="row-input">
          <input type="text" id="my-id" readonly value="Đang tạo mã...">
          <button class="btn-chess btn-gray" style="padding: 6px 10px;" onclick="copyId()">Copy</button>
        </div>
        <div class="row-input" style="margin-top: 6px;">
          <input type="text" id="peer-id-input" placeholder="Nhập mã bạn bè...">
          <button class="btn-chess btn-green" style="padding: 6px 10px;" onclick="joinRoom()">Vào</button>
        </div>
      </div>

      <div class="menu-group" style="display: flex; flex-direction: row; gap: 6px;">
        <button class="btn-chess btn-red" style="flex:1;" onclick="surrenderGame()">🏳️ Chịu thua</button>
        <button class="btn-chess btn-gray" style="flex:1; background:#ca8a04;" onclick="offerDraw()">🤝 Xin hòa</button>
      </div>
    </div>
  </div>

<script>

    if (val) playerName = val;
    document.getElementById('my-display-name').textContent = "👤 " + playerName;
    document.getElementById('name-modal').style.display = 'none';
  }

  };

  let peer = null;
  let conn = null;
  let gameMode = 'bot';
  let myColor = 'w';
  let selectedSquare = null;
  let legalMoves = [];
  let lastMove = null;

  let baseMinutes = 3;
  let incrementSeconds = 2;
  let whiteTime = 180;
  let blackTime = 180;
  let timerInterval = null;

  function setTimeMode(min, inc, btn) {
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    baseMinutes = min;
    incrementSeconds = inc;
    whiteTime = min * 60;
    blackTime = min * 60;
    updateTimerDisplay();
  }

  function startClock() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (game.game_over()) return;
      if (game.turn() === 'w') {
        if (whiteTime > 0) whiteTime--;
        else { alert("Hết giờ! Quân Đen chiến thắng."); clearInterval(timerInterval); }
      } else {
        if (blackTime > 0) blackTime--;
        else { alert("Hết giờ! Quân Trắng chiến thắng."); clearInterval(timerInterval); }
      }
      updateTimerDisplay();
    }, 1000);
  }

  function updateTimerDisplay() {
    document.getElementById('white-timer').textContent = formatTime(whiteTime);
    document.getElementById('black-timer').textContent = formatTime(blackTime);
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function initPeer(customId = null, onReady = null) {
    if (peer) peer.destroy();
    const idToUse = customId || ('cv-' + Math.random().toString(36).substring(2, 7));
    peer = new Peer(idToUse);
    peer.on('open', (id) => { myIdInput.value = id; if (onReady) onReady(id); });
    peer.on('connection', (connection) => {
      if (conn) { connection.close(); return; }
      gameMode = 'pvp';
      conn = connection;
      myColor = 'w';
      setupConnection();
      game.reset();
      lastMove = null;
      whiteTime = baseMinutes * 60;
      blackTime = baseMinutes * 60;
      startClock();
      document.getElementById('opponent-name').textContent = "🌐 Đối thủ Online";
      statusEl.textContent = "Đối thủ đã vào! Lượt của bạn.";
      renderBoard();
    });
  }

  function startBotMode() {
    if (conn) { conn.close(); conn = null; }
    gameMode = 'bot';
    myColor = 'w';
    game.reset();
    lastMove = null;
    selectedSquare = null;
    legalMoves = [];
    whiteTime = baseMinutes * 60;
    blackTime = baseMinutes * 60;
    startClock();
    document.getElementById('opponent-name').textContent = "🤖 Bot thông minh";
    statusEl.textContent = `${playerName} đấu với Bot (Quân Trắng)`;
    renderBoard();
  }

  const pieceValues = { p: 10, n: 32, b: 33, r: 50, q: 90, k: 900 };
  function evaluateBoard(chessObj) {
    let total = 0;
    const b = chessObj.board();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = b[r][c];
        if (p) {
          const val = pieceValues[p.type] || 0;
          total += (p.color === 'b' ? val : -val);
        }
      }
    }
    return total;
  }

  function makeBotMove() {
    if (game.game_over() || gameMode !== 'bot') return;
    const moves = game.moves({ verbose: true });
    if (moves.length === 0) return;
    let bestMove = null;
    let bestScore = -99999;
    moves.sort(() => Math.random() - 0.5);

    for (const move of moves) {
      game.move(move);
      let score = evaluateBoard(game);
      if (game.in_checkmate()) {
        score = 99999;
      } else {
        const playerMoves = game.moves({ verbose: true });
        let worstReply = 99999;
        for (const pMove of playerMoves) {
          game.move(pMove);
          const replyScore = evaluateBoard(game);
          if (replyScore < worstReply) worstReply = replyScore;
          game.undo();
        }
        if (playerMoves.length > 0) score = worstReply;
      }
      game.undo();
      if (score > bestScore) { bestScore = score; bestMove = move; }
    }

    if (bestMove) {
      const res = game.move(bestMove);
      lastMove = { from: res.from, to: res.to };
      if (game.turn() === 'w') whiteTime += incrementSeconds;
      else blackTime += incrementSeconds;
      updateStatus();
      renderBoard();
    }
  }

  const QUICK_ROOM_ID = 'dxc-chess-quick-lobby-999';
  function startQuickMatch() {
    if (conn) { conn.close(); conn = null; }
    gameMode = 'pvp';
    statusEl.textContent = "⚡ Đang tìm đối thủ ngẫu nhiên...";
    if (!peer || peer.destroyed) {
      initPeer(null, () => tryConnectQuick());
    } else {
      tryConnectQuick();
    }
  }

  function tryConnectQuick() {
    const testConn = peer.connect(QUICK_ROOM_ID);
    let connected = false;
    const timeout = setTimeout(() => {
      if (!connected) { testConn.close(); becomeQuickHost(); }
    }, 2500);

    testConn.on('open', () => {
      connected = true;
      clearTimeout(timeout);
      conn = testConn;
      myColor = 'b';
      setupConnection();
      game.reset();
      lastMove = null;
      whiteTime = baseMinutes * 60;
      blackTime = baseMinutes * 60;
      startClock();
      document.getElementById('opponent-name').textContent = "🌐 Đối thủ Ngẫu nhiên";
      statusEl.textContent = "Đã ghép trận! Đợi đối thủ đi (Bạn cầm Đen)";
      renderBoard();
    });
    testConn.on('error', () => { clearTimeout(timeout); becomeQuickHost(); });
  }

  function becomeQuickHost() {
    statusEl.textContent = "⚡ Đang mở sảnh chờ đối thủ...";
    if (peer) peer.destroy();
    peer = new Peer(QUICK_ROOM_ID);
    peer.on('open', () => { myIdInput.value = "Sảnh ghép nhanh"; });
    peer.on('connection', (connection) => {
      if (conn) { connection.close(); return; }
      conn = connection;
      myColor = 'w';
      setupConnection();
      game.reset();
      lastMove = null;
      whiteTime = baseMinutes * 60;
      blackTime = baseMinutes * 60;
      startClock();
      document.getElementById('opponent-name').textContent = "🌐 Đối thủ Ngẫu nhiên";
      statusEl.textContent = "Tìm thấy đối thủ! Lượt của bạn.";
      renderBoard();
    });
  }

  function joinRoom() {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if (!targetId) return alert("Vui lòng nhập mã phòng!");
    gameMode = 'pvp';
    conn = peer.connect(targetId);
    myColor = 'b';
    setupConnection();
  }

  function setupConnection() {
    conn.on('open', () => { updateStatus(); renderBoard(); });
    conn.on('data', (data) => {
      if (data.type === 'move') {
        game.move(data.move);
        lastMove = { from: data.move.from, to: data.move.to };
        if (data.move.color === 'w') whiteTime += incrementSeconds;
        else blackTime += incrementSeconds;
        selectedSquare = null;
        legalMoves = [];
        updateStatus();
        renderBoard();
      } else if (data.type === 'surrender') {
        alert("Đối thủ đã đầu hàng! Bạn chiến thắng.");
        game.reset();
        renderBoard();
      } else if (data.type === 'draw_offer') {
        if (confirm("Đối thủ muốn xin hòa. Bạn đồng ý chứ?")) {
          conn.send({ type: 'draw_accept' });
          alert("Ván cờ hòa!");
          game.reset();
          renderBoard();
        }
      } else if (data.type === 'draw_accept') {
        alert("Đối thủ đã đồng ý hòa!");
        game.reset();
        renderBoard();
      }
    });
  }

  function copyId() {
    myIdInput.select();
    document.execCommand('copy');
    alert("Đã copy mã phòng!");
  }

  function surrenderGame() {
    if (gameMode === 'bot') {
      if (confirm("Bạn muốn chịu thua Bot?")) startBotMode();
      return;
    }
    if (!conn || !conn.open) return alert("Chưa kết nối trận đấu!");
    if (confirm("Bạn chắc chắn muốn đầu hàng?")) {
      conn.send({ type: 'surrender' });
      alert("Bạn đã thua.");
      game.reset();
      renderBoard();
    }
  }

  function offerDraw() {
    if (gameMode === 'bot') {
      alert("Bot không đồng ý hòa đâu!");
      return;
    }
    if (!conn || !conn.open) return alert("Chưa kết nối trận đấu!");
    conn.send({ type: 'draw_offer' });
    alert("Đã gửi lời xin hòa!");
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    const boardData = game.board();
    const isFlipped = (myColor === 'b');

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const row = isFlipped ? 7 - r : r;
        const col = isFlipped ? 7 - c : c;
        const piece = boardData[row][col];

        const sqDiv = document.createElement('div');
        const isLight = (row + col) % 2 === 0;
        sqDiv.className = `square ${isLight ? 'light' : 'dark'}`;

        const fileChar = String.fromCharCode(97 + col);
        const rankNum = 8 - row;
        const squareName = fileChar + rankNum;

        if (selectedSquare === squareName) sqDiv.classList.add('selected');
        if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
          sqDiv.classList.add('last-move');
        }

        const moveHint = legalMoves.find(m => m.to === squareName);
        if (moveHint) {
          sqDiv.classList.add(piece ? 'hint-capture' : 'hint');
        }

        if (piece) {
          const pieceDiv = document.createElement('div');
          pieceDiv.className = 'piece';
          pieceDiv.innerHTML = SVG_PIECES[piece.color + piece.type];
          sqDiv.appendChild(pieceDiv);

          if (piece.type === 'k' && piece.color === game.turn() && game.in_check()) {
            sqDiv.classList.add('in-check');
          }
        }

        sqDiv.onclick = () => onSquareClick(squareName);
        boardEl.appendChild(sqDiv);
      }
    }
  }

  function onSquareClick(square) {
    if (gameMode === 'pvp' && (!conn || !conn.open)) {
      alert("Hãy chọn Đấu Bot, Ghép nhanh hoặc nhập mã phòng trước nhé!");
      return;
    }
    if (game.game_over()) return;
    if (game.turn() !== myColor) return;

    const moveAttempt = legalMoves.find(m => m.to === square);
    if (moveAttempt) {
      const moveObj = { from: selectedSquare, to: square, promotion: 'q' };
      const result = game.move(moveObj);
      if (result) {
        lastMove = { from: result.from, to: result.to };
        if (result.color === 'w') whiteTime += incrementSeconds;
        else blackTime += incrementSeconds;

        selectedSquare = null;
        legalMoves = [];
        updateStatus();
        renderBoard();

        if (gameMode === 'bot') {
          setTimeout(makeBotMove, 400);
        } else if (conn && conn.open) {
          conn.send({ type: 'move', move: moveObj });
        }
        return;
      }
    }

    const piece = game.get(square);
    if (piece && piece.color === myColor) {
      selectedSquare = square;
      legalMoves = game.moves({ square: square, verbose: true });
    } else {
      selectedSquare = null;
      legalMoves = [];
    }
    renderBoard();
  }

  function updateStatus() {
    if (game.in_checkmate()) {
      const winner = game.turn() === 'w' ? 'Đen' : 'Trắng';
      statusEl.textContent = `🏆 Chiếu bí! Quân ${winner} thắng!`;
      if (timerInterval) clearInterval(timerInterval);
      return;
    }
    if (game.in_draw()) {
      statusEl.textContent = "🤝 Ván cờ Hòa!";
      if (timerInterval) clearInterval(timerInterval);
      return;
    }

    const turnName = game.turn() === 'w' ? 'Trắng' : 'Đen';
    const isMyTurn = game.turn() === myColor;
    const checkText = game.in_check() ? " (CHIẾU TƯỚNG!)" : "";
    statusEl.textContent = isMyTurn ? `🟢 Lượt của bạn (${turnName})${checkText}` : `⏳ Đợi đối thủ đi...`;
  }

  initPeer();
  startBotMode();
  updateTimerDisplay();
</script>
