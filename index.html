<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Chính Ok — My Space</title>
<style>
*{box-sizing:border-box}
:root{--glass:rgba(15,15,15,.55);--line:rgba(255,255,255,.15);--white:#fff}
body{
 margin:0;min-height:100vh;color:var(--white);
 font-family:"Trebuchet MS",Arial,sans-serif;
 background:
  linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.45)),
  url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2200&q=90") center/cover fixed no-repeat,
  #080808;
 overflow-x:hidden;
 display:flex;justify-content:center;align-items:center;padding:30px 14px;
}

/* Màn hình chờ click để vào web */
#enter-screen{
 position:fixed;inset:0;z-index:99999;
 background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 cursor:pointer;transition:opacity 0.4s ease;
}
#enter-screen h1{
 font-size:26px;font-weight:bold;color:#fff;margin:0 0 8px;
 text-shadow:0 0 10px rgba(255,255,255,0.5);
}
#enter-screen p{
 font-size:13px;color:#aaa;margin:0;letter-spacing:1px;
}

/* Hiệu ứng mưa rơi */
.rain{position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:1;
 background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(255,255,255,.65) 26px,transparent 28px);
 background-size:2px 95px;animation:rain .75s linear infinite}
@keyframes rain{to{background-position:0 95px}}

main{position:relative;z-index:2;width:min(760px,100%)}

.panel{
 background:var(--glass);border:1px solid var(--line);border-radius:28px;
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 box-shadow:0 15px 45px rgba(0,0,0,.65);
}

/* Khung thông tin trên */
.profile{padding:28px 30px 20px;text-align:left}
.avatar{
 width:165px;height:165px;border-radius:50%;background:#050505;
 border:2px solid rgba(255,255,255,.6);
 background-image: url('https://cdn.upanhlaylink.com/i/NaAt4Asj.png');
 background-size: cover; background-position: center;
 box-shadow:0 8px 25px rgba(0,0,0,.8);
}
.name{font-size:34px;font-weight:900;margin:16px 0 8px;letter-spacing:.5px}
.bio{font-weight:700;margin:0 0 16px;font-size:15px;color:#eee}

/* Icon mạng xã hội chuẩn SVG */
.socials{display:flex;gap:14px;margin-bottom:16px}
.socials a{
 width:40px;height:40px;display:grid;place-items:center;border-radius:50%;
 background:rgba(255,255,255,0.15);color:#fff;text-decoration:none;
 transition:transform .2s, background .2s;
 border: 1px solid rgba(255,255,255,0.2);
}
.socials a:hover{transform:translateY(-2px);background:rgba(255,255,255,0.3)}
.socials svg{width:20px;height:20px;fill:currentColor;}

/* Bộ đếm View và Nút Thả Tim */
.counter-box{
 display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;
}
.counter-badge{
 display:flex;align-items:center;gap:8px;
 background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
 padding:8px 16px;border-radius:20px;font-size:13px;font-weight:bold;color:#ddd;
 user-select:none;
}
.counter-badge svg{width:16px;height:16px;fill:currentColor}
.like-btn{
 cursor:pointer;transition:all .2s;background:rgba(255,255,255,0.12);
 border:1px solid rgba(255,255,255,0.25);
}
.like-btn:hover{background:rgba(255,71,87,0.2);border-color:rgba(255,71,87,0.45);color:#ff6b6b;transform:scale(1.05)}
.like-btn:active{transform:scale(0.95)}
.like-btn.liked{background:rgba(255,71,87,0.25);border-color:rgba(255,71,87,0.6);color:#ff6b6b}

/* Khung Discord */
.discord{
 border-radius:22px;background:rgba(0,0,0,.45);
 border:1px solid rgba(255,255,255,.1);padding:14px 18px;
 display:flex;align-items:center;gap:16px;
}
.discord-logo{
 width:76px;height:76px;border-radius:50%;background:#000;border:1.5px solid rgba(255,255,255,.45);
 background-image: url('https://cdn.upanhlaylink.com/i/RYCLgMFE.png');
 background-size: cover; background-position: center;
 flex:none;
}
.discord-info strong{font-size:17px;display:block;margin-bottom:4px}
.status{font-size:12px;color:#bbb;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#23a55a;display:inline-block}
.profile-btn{
 display:inline-block;background:#248e58;color:#fff;text-decoration:none;
 border-radius:20px;padding:6px 16px;font-size:12px;font-weight:bold;transition:background .2s;
}
.profile-btn:hover{background:#2ba868}

/* Vị trí Hà Nội */
.stats{
 display:flex;align-items:center;gap:6px;margin-top:18px;
 font-weight:bold;font-size:14px;color:#fff;
}
.stats svg{width:16px;height:16px;fill:currentColor;flex:none}

/* Khung phát nhạc bên dưới */
.music{margin-top:16px;padding:20px 24px}
.player-top{display:flex;align-items:center;gap:16px}
.cover{
 width:88px;height:88px;border-radius:16px;flex:none;
 background:#111 url("https://cdn.upanhlaylink.com/i/tTmGrCdh.jpg") center/cover;
 box-shadow:0 4px 15px rgba(0,0,0,.5);
}
.track{min-width:0;flex:1}
.track-title{font-size:21px;font-weight:900;margin-bottom:14px}
.controls{display:flex;align-items:center;gap:12px}
.time{font-size:13px;font-weight:bold;white-space:nowrap;color:#ddd}
.seek{height:6px;border-radius:9px;background:rgba(255,255,255,.35);flex:1;cursor:pointer;position:relative;overflow:visible}
.seek-fill{height:100%;width:0%;background:#fff;border-radius:9px;position:relative}
.seek-fill::after{
 content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);
 width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 6px #000;
}
.control{border:0;background:transparent;color:#fff;cursor:pointer;padding:4px;display:grid;place-items:center;transition:transform .15s}
.control:hover{transform:scale(1.1)}
.play{
 width:40px;height:40px;border-radius:50%;background:#fff;color:#111;
 display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.play svg{width:18px;height:18px;fill:currentColor}

/* --- ICON CHAT NỔI Ở GÓC TRÁI --- */
.chat-float-btn {
 position: fixed;
 bottom: 25px;
 left: 25px;
 z-index: 9999;
 width: 50px;
 height: 50px;
 background: rgba(30, 30, 30, 0.85);
 border: 1px solid rgba(255, 255, 255, 0.25);
 border-radius: 12px;
 display: grid;
 place-items: center;
 cursor: pointer;
 backdrop-filter: blur(10px);
 box-shadow: 0 8px 25px rgba(0,0,0,0.5);
 transition: transform 0.2s, background 0.2s;
}
.chat-float-btn:hover { transform: scale(1.08); background: rgba(50, 50, 50, 0.95); }
.chat-float-btn svg { width: 22px; height: 22px; fill: #fff; }

@keyframes messengerBounce {
 0%, 100% { transform: translateY(0); }
 20%, 60% { transform: translateY(-6px) scale(1.1); }
 40%, 80% { transform: translateY(-3px) scale(1.05); }
}
.chat-float-btn.new-msg {
 animation: messengerBounce 0.6s ease infinite;
 border-color: #ff4757;
}

.chat-badge {
 position: absolute;
 top: -6px;
 right: -6px;
 background: #ff4757;
 color: #fff;
 font-size: 11px;
 font-weight: bold;
 padding: 2px 6px;
 border-radius: 10px;
 border: 1px solid rgba(255,255,255,0.3);
 display: none;
}

/* --- POPUP KHUNG CHAT CỘNG ĐỒNG --- */
.chat-popup {
 position: fixed;
 bottom: 85px;
 left: 25px;
 z-index: 99999;
 width: 340px;
 height: 460px;
 background: rgba(18, 18, 18, 0.88);
 border: 1px solid rgba(255, 255, 255, 0.18);
 border-radius: 16px;
 backdrop-filter: blur(16px);
 -webkit-backdrop-filter: blur(16px);
 box-shadow: 0 15px 45px rgba(0,0,0,0.7);
 display: none;
 flex-direction: column;
 overflow: hidden;
 animation: popUpIn 0.25s ease;
}
@keyframes popUpIn {
 from { opacity: 0; transform: translateY(15px) scale(0.95); }
 to { opacity: 1; transform: translateY(0) scale(1); }
}

.chat-header {
 padding: 12px 16px;
 background: rgba(255, 255, 255, 0.05);
 border-bottom: 1px solid rgba(255, 255, 255, 0.1);
 display: flex;
 align-items: center;
 justify-content: space-between;
 font-weight: bold;
 font-size: 14px;
}
.chat-header-left { display: flex; align-items: center; gap: 8px; }
.chat-header-left svg { width: 16px; height: 16px; fill: #fff; }
.chat-close { background: none; border: 0; color: #aaa; cursor: pointer; font-size: 16px; transition: color 0.2s; }
.chat-close:hover { color: #fff; }

/* Màn hình nhập tên */
.chat-login-screen {
 flex: 1;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 24px;
 text-align: center;
}
.chat-login-icon {
 width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.08);
 display: grid; place-items: center; margin-bottom: 14px;
 border: 1px solid rgba(255,255,255,0.15);
}
.chat-login-icon svg { width: 28px; height: 28px; fill: #aaa; }
.chat-login-screen p { font-size: 12px; color: #aaa; margin: 0 0 14px; }
.chat-name-input {
 width: 100%; padding: 10px 14px; border-radius: 10px;
 background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
 color: #fff; font-size: 13px; outline: none; margin-bottom: 12px;
 text-align: center;
}
.chat-login-btn {
 width: 100%; padding: 10px; border-radius: 10px; border: 0;
 background: rgba(255,255,255,0.15); color: #fff; font-weight: bold;
 font-size: 13px; cursor: pointer; transition: background 0.2s;
 border: 1px solid rgba(255,255,255,0.25);
}
.chat-login-btn:hover { background: rgba(255,255,255,0.25); }

/* Màn hình nhắn tin chính */
.chat-messages-screen {
 flex: 1;
 display: none;
 flex-direction: column;
 overflow: hidden;
}
.chat-messages-list {
 flex: 1;
 padding: 12px;
 overflow-y: auto;
 display: flex;
 flex-direction: column;
 gap: 8px;
 scrollbar-width: thin;
}
.chat-msg-item {
 background: rgba(255,255,255,0.06);
 padding: 8px 12px;
 border-radius: 10px;
 font-size: 13px;
 border: 1px solid rgba(255,255,255,0.08);
 word-break: break-word;
}
.chat-msg-author { font-size: 11px; color: #38ef7d; font-weight: bold; margin-bottom: 2px; }
.chat-msg-text { color: #eee; }

.chat-input-area {
 padding: 10px;
 background: rgba(0,0,0,0.3);
 border-top: 1px solid rgba(255,255,255,0.1);
 display: flex;
 gap: 8px;
}
.chat-text-input {
 flex: 1;
 padding: 8px 12px;
 border-radius: 10px;
 background: rgba(0,0,0,0.5);
 border: 1px solid rgba(255,255,255,0.2);
 color: #fff;
 font-size: 13px;
 outline: none;
}
.chat-send-btn {
 padding: 8px 16px;
 border-radius: 10px;
 border: 0;
 background: #fff;
 color: #111;
 font-weight: bold;
 font-size: 13px;
 cursor: pointer;
 transition: background 0.2s;
}
.chat-send-btn:hover { background: #eee; }

#sc-widget{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}

@media(max-width:560px){
 .profile{padding:22px 20px 18px}
 .avatar{width:135px;height:135px}
 .name{font-size:28px}
 .cover{width:72px;height:72px}
 .track-title{font-size:17px}
 .controls{gap:8px}
 .chat-popup { width: calc(100vw - 30px); left: 15px; bottom: 80px; }
}
</style>
</head>

<script>
// --- XỬ LÝ MỞ / ĐÓNG POPUP CHAT ---
const chatToggleBtn = document.getElementById('chat-toggle-btn');
const chatPopupBox = document.getElementById('chat-popup-box');
const chatCloseBtn = document.getElementById('chat-close-btn');
const badgeCount = document.getElementById('chat-badge-count');

let unreadCount = 0;
let lastMsgCount = 0;

chatToggleBtn.addEventListener('click', () => {
 const isVisible = chatPopupBox.style.display === 'flex';
 if (!isVisible) {
  chatPopupBox.style.display = 'flex';
  unreadCount = 0;
  badgeCount.style.display = 'none';
  chatToggleBtn.classList.remove('new-msg');
 } else {
  chatPopupBox.style.display = 'none';
 }
});

chatCloseBtn.addEventListener('click', () => {
 chatPopupBox.style.display = 'none';
});

// --- HỆ THỐNG CHAT AN TOÀN ---
const loginView = document.getElementById('chat-login-view');
const mainView = document.getElementById('chat-main-view');
const usernameInput = document.getElementById('chat-username-input');
const loginBtn = document.getElementById('chat-login-submit');
const messageInput = document.getElementById('chat-message-input');
const sendBtn = document.getElementById('chat-send-btn');
const messagesContainer = document.getElementById('chat-messages-container');

let currentUser = localStorage.getItem('dxc_chat_user') || '';

if (currentUser) {
 loginView.style.display = 'none';
 mainView.style.display = 'flex';
}

loginBtn.addEventListener('click', () => {
 const name = usernameInput.value.trim();
 if (!name) {
  alert('Vui lòng nhập tên của bạn!');
  return;
 }
 currentUser = name;
 localStorage.setItem('dxc_chat_user', currentUser);
 loginView.style.display = 'none';
 mainView.style.display = 'flex';
});

const STORAGE_KEY = 'dxc_final_safe_chat';

function getLocalChat() {
 try {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) return JSON.parse(data);
 } catch(e){}
 return [
  { author: 'DXC STORE', text: 'Chào mừng các bạn đến với góc trò chuyện cộng đồng! 🎉' }
 ];
}

function saveLocalChat(msgs) {
 try {
  if (msgs.length > 50) msgs = msgs.slice(msgs.length - 50);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
  localStorage.setItem('dxc_chat_sync_ping', Date.now().toString());
 } catch(e){}
}

function renderChatUI(msgs, isInitial = false) {
 messagesContainer.innerHTML = '';
 msgs.forEach(m => {
  const div = document.createElement('div');
  div.className = 'chat-msg-item';
  div.innerHTML = `<div class="chat-msg-author">${escapeHtml(m.author)}</div><div class="chat-msg-text">${escapeHtml(m.text)}</div>`;
  messagesContainer.appendChild(div);
 });
 messagesContainer.scrollTop = messagesContainer.scrollHeight;

 if (!isInitial && msgs.length > lastMsgCount) {
  if (chatPopupBox.style.display !== 'flex') {
   unreadCount += (msgs.length - lastMsgCount);
   badgeCount.textContent = unreadCount;
   badgeCount.style.display = 'block';
   chatToggleBtn.classList.add('new-msg');
  }
 }
 lastMsgCount = msgs.length;
 badgeCount.textContent = lastMsgCount;
}

function escapeHtml(text) {
 const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
 return text.replace(/[&<>"']/g, m => map[m]);
}

sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', (e) => {
 if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
 const text = messageInput.value.trim();
 if (!text) return;
 if (!currentUser) {
  alert('Vui lòng đăng nhập tên trước!');
  return;
 }

 let msgs = getLocalChat();
 msgs.push({ author: currentUser, text: text });
 saveLocalChat(msgs);
 
 messageInput.value = '';
 renderChatUI(msgs);
}

renderChatUI(getLocalChat(), true);

window.addEventListener('storage', (e) => {
 if (e.key === STORAGE_KEY || e.key === 'dxc_chat_sync_ping') {
  renderChatUI(getLocalChat(), false);
 }
});

// --- MÀN HÌNH CHÀO MỪNG & NHẠC ---
const enterScreen = document.getElementById('enter-screen');
let ready = false, playing = false;

enterScreen.addEventListener('click', () => {
 enterScreen.style.opacity = '0';
 setTimeout(() => { enterScreen.style.display = 'none'; }, 400);
 if (ready) { widget.play(); }
});

// --- BỘ ĐẾM VIEW & TIM ---
const ABACUS_BASE = "https://abacus.jasoncameron.dev";
const NS = "dxcstore_github_io";

async function fetchAbacus(action, key) {
 try {
  const res = await fetch(`${ABACUS_BASE}/${action}/${NS}/${key}`, { cache: "no-store" });
  if (!res.ok) throw new Error("Network error");
  const data = await res.json();
  return data.value;
 } catch (e) {
  return null;
 }
}

window.addEventListener('DOMContentLoaded', async () => {
 const viewEl = document.getElementById('view-count');
 const likeEl = document.getElementById('like-count');
 const likeBtn = document.getElementById('like-btn');

 const views = await fetchAbacus("hit", "views");
 viewEl.textContent = views !== null ? views : "0";

 const likes = await fetchAbacus("get", "likes");
 likeEl.textContent = likes !== null ? likes : "0";

 if (localStorage.getItem("dxc_liked_v2") === "1") {
  likeBtn.classList.add("liked");
 }

 likeBtn.addEventListener('click', async () => {
  if (localStorage.getItem("dxc_liked_v2") === "1") return;
  localStorage.setItem("dxc_liked_v2", "1");
  likeBtn.classList.add("liked");

  const currentLikes = parseInt(likeEl.textContent, 10) || 0;
  likeEl.textContent = currentLikes + 1;

  const updatedLikes = await fetchAbacus("hit", "likes");
  if (updatedLikes !== null) {
   likeEl.textContent = updatedLikes;
  }
 });
});

// Điều khiển nhạc SoundCloud
const frame = document.getElementById('sc-widget');
const widget = SC.Widget(frame);
const toggle = document.getElementById('toggle');
const seek = document.getElementById('seek');
const fill = document.getElementById('fill');
const current = document.getElementById('current');
const duration = document.getElementById('duration');

const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

let total = 0;

function stamp(ms) {
 let s = Math.floor((ms || 0) / 1000);
 return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

widget.bind(SC.Widget.Events.READY, () => {
 ready = true;
 widget.getDuration(d => { total = d; duration.textContent = stamp(d); });
});

widget.bind(SC.Widget.Events.PLAY, () => { playing = true; toggle.innerHTML = pauseIcon; });
widget.bind(SC.Widget.Events.PAUSE, () => { playing = false; toggle.innerHTML = playIcon; });
widget.bind(SC.Widget.Events.FINISH, () => { playing = false; toggle.innerHTML = playIcon; fill.style.width = '0%'; });
widget.bind(SC.Widget.Events.PLAY_PROGRESS, e => {
 if (!total) total = e.duration || 0;
 current.textContent = stamp(e.currentPosition);
 if (total) fill.style.width = (e.currentPosition / total * 100) + '%';
});

toggle.addEventListener('click', (e) => { 
 e.stopPropagation();
 if (ready) playing ? widget.pause() : widget.play(); 
});
seek.addEventListener('click', e => {
 e.stopPropagation();
 if (!total) return;
 const r = seek.getBoundingClientRect();
 widget.seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * total);
});
document.getElementById('back').addEventListener('click', (e) => {
 e.stopPropagation();
 widget.getPosition(p => widget.seekTo(Math.max(0, p - 10000)));
});
document.getElementById('forward').addEventListener('click', (e) => {
 e.stopPropagation();
 widget.getPosition(p => widget.seekTo(Math.min(total, p + 10000)));
});
</script>
