<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Chính Ok — My Space</title>
<style>
*{box-sizing:border-box}
:root{--glass:rgba(15,15,15,.55);--line:rgba(255,255,255,.15);--white:#fff}
body{
 margin:0;min-height:100vh;color:var(--white);
 font-family:"Trebuchet MS",Arial,sans-serif;
 background:
  linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.45)),
  url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2200&q=90") center/cover fixed no-repeat,
  #080808;
 overflow-x:hidden;
 display:flex;justify-content:center;align-items:center;padding:30px 14px;
}

/* Màn hình chờ click để vào web */
#enter-screen{
 position:fixed;inset:0;z-index:9999;
 background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 cursor:pointer;transition:opacity 0.5s ease;
}
#enter-screen h1{
 font-size:26px;font-weight:bold;color:#fff;margin:0 0 8px;
 text-shadow:0 0 10px rgba(255,255,255,0.5);
}
#enter-screen p{
 font-size:13px;color:#aaa;margin:0;letter-spacing:1px;
}

/* Hiệu ứng mưa rơi */
.rain{position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:1;
 background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(255,255,255,.65) 26px,transparent 28px);
 background-size:2px 95px;animation:rain .75s linear infinite}
@keyframes rain{to{background-position:0 95px}}

main{position:relative;z-index:2;width:min(760px,100%)}

.panel{
 background:var(--glass);border:1px solid var(--line);border-radius:28px;
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 box-shadow:0 15px 45px rgba(0,0,0,.65);
}

/* Khung thông tin trên */
.profile{padding:28px 30px 20px;text-align:left}
.avatar{
 width:165px;height:165px;border-radius:50%;background:#050505;
 border:2px solid rgba(255,255,255,.6);
 background-image: url('https://cdn.upanhlaylink.com/i/NaAt4Asj.png');
 background-size: cover; background-position: center;
 box-shadow:0 8px 25px rgba(0,0,0,.8);
}
.name{font-size:34px;font-weight:900;margin:16px 0 8px;letter-spacing:.5px}
.bio{font-weight:700;margin:0 0 16px;font-size:15px;color:#eee}

/* Icon mạng xã hội chuẩn SVG */
.socials{display:flex;gap:14px;margin-bottom:22px}
.socials a{
 width:40px;height:40px;display:grid;place-items:center;border-radius:50%;
 background:rgba(255,255,255,0.15);color:#fff;text-decoration:none;
 transition:transform .2s, background .2s;
 border: 1px solid rgba(255,255,255,0.2);
}
.socials a:hover{transform:translateY(-2px);background:rgba(255,255,255,0.3)}
.socials svg{width:20px;height:20px;fill:currentColor;}

/* Khung Discord */
.discord{
 border-radius:22px;background:rgba(0,0,0,.45);
 border:1px solid rgba(255,255,255,.1);padding:14px 18px;
 display:flex;align-items:center;gap:16px;
}
.discord-logo{
 width:76px;height:76px;border-radius:50%;background:#000;border:1.5px solid rgba(255,255,255,.45);
 background-image: url('https://cdn.upanhlaylink.com/i/RYCLgMFE.png');
 background-size: cover; background-position: center;
 flex:none;
}
.discord-info strong{font-size:17px;display:block;margin-bottom:4px}
.status{font-size:12px;color:#bbb;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#23a55a;display:inline-block}
.profile-btn{
 display:inline-block;background:#248e58;color:#fff;text-decoration:none;
 border-radius:20px;padding:6px 16px;font-size:12px;font-weight:bold;transition:background .2s;
}
.profile-btn:hover{background:#2ba868}

/* Vị trí Hà Nội */
.stats{
 display:flex;align-items:center;gap:6px;margin-top:18px;
 font-weight:bold;font-size:14px;color:#fff;
}
.stats svg{width:16px;height:16px;fill:currentColor;flex:none}

/* Khung phát nhạc bên dưới */
.music{margin-top:16px;padding:20px 24px}
.player-top{display:flex;align-items:center;gap:16px}
.cover{
 width:88px;height:88px;border-radius:16px;flex:none;
 background:#111 url("https://cdn.upanhlaylink.com/i/tTmGrCdh.jpg") center/cover;
 box-shadow:0 4px 15px rgba(0,0,0,.5);
}
.track{min-width:0;flex:1}
.track-title{font-size:21px;font-weight:900;margin-bottom:14px}
.controls{display:flex;align-items:center;gap:12px}
.time{font-size:13px;font-weight:bold;white-space:nowrap;color:#ddd}
.seek{height:6px;border-radius:9px;background:rgba(255,255,255,.35);flex:1;cursor:pointer;position:relative;overflow:visible}
.seek-fill{height:100%;width:0%;background:#fff;border-radius:9px;position:relative}
.seek-fill::after{
 content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);
 width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 6px #000;
}
.control{border:0;background:transparent;color:#fff;cursor:pointer;padding:4px;display:grid;place-items:center;transition:transform .15s}
.control:hover{transform:scale(1.1)}
.play{
 width:40px;height:40px;border-radius:50%;background:#fff;color:#111;
 display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.play svg{width:18px;height:18px;fill:currentColor}

/* Khung Bình luận toàn cầu */
.comments-section{margin-top:16px;padding:20px 24px}
.comments-title{font-size:18px;font-weight:900;margin-bottom:14px}
.comment-form{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.comment-input, .comment-textarea{
 width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.2);
 border-radius:12px;padding:10px 14px;color:#fff;font-family:inherit;font-size:14px;outline:none;
 transition:border-color .2s;
}
.comment-input:focus, .comment-textarea:focus{border-color:rgba(255,255,255,0.5)}
.comment-textarea{resize:vertical;min-height:60px}
.comment-btn{
 align-self:flex-end;background:#248e58;color:#fff;border:none;border-radius:16px;
 padding:8px 20px;font-weight:bold;font-size:13px;cursor:pointer;transition:background .2s;
}
.comment-btn:hover{background:#2ba868}
.comments-list{display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto;padding-right:4px}
.comment-item{
 background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);
 border-radius:12px;padding:10px 14px;
}
.comment-user{font-weight:bold;font-size:13px;color:#2ba868;margin-bottom:3px}
.comment-text{font-size:14px;color:#ddd;word-break:break-word;margin:0}

#sc-widget{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}

@media(max-width:560px){
 .profile{padding:22px 20px 18px}
 .avatar{width:135px;height:135px}
 .name{font-size:28px}
 .cover{width:72px;height:72px}
 .track-title{font-size:17px}
 .controls{gap:8px}
}
</style>
</head>
<body>

<!-- Màn hình chào mừng yêu cầu click -->
<div id="enter-screen">
 <h1>click de vao trong nhee</h1>
 <p>hello</p>
</div>

<div class="rain"></div>

<main>
 <section class="panel profile">
  <div class="avatar"></div>
  <h1 class="name">Chính Ok</h1>
  <p class="bio">đẹp zai 2 lai ✦</p>
  
  <nav class="socials">
   <a href="https://www.youtube.com/@DXCMODGAME" target="_blank" rel="noopener" title="YouTube">
    <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
   </a>
   <a href="https://www.facebook.com/" target="_blank" rel="noopener" title="Facebook">
    <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
   </a>
   <a href="https://discord.gg/r2VzVkSSAc" target="_blank" rel="noopener" title="Discord">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
   </a>
  </nav>

  <div class="discord">
   <div class="discord-logo"></div>
   <div class="discord-info">
    <strong>DXC STORE</strong>
    <div class="status">Sever discord của tôi</div>
    <a class="profile-btn" href="https://discord.gg/r2VzVkSSAc" target="_blank" rel="noopener">View Profile</a>
   </div>
  </div>

  <div class="stats">
   <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
   Hà Nội
  </div>
 </section>

 <section class="panel music">
  <div class="player-top">
   <div class="cover"></div>
   <div class="track">
    <div class="track-title">Chờ anh chút thôi...</div>
    <div class="controls">

     <div class="seek" id="seek"><div class="seek-fill" id="fill"></div></div>
     <span class="time" id="duration">--:--</span>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>

 </section>

 <section class="panel comments-section">
  <div class="comments-title">💬 Góc Lời Nhắn (Toàn Cầu)</div>
  <form class="comment-form" id="commentForm">
   <input type="text" id="commentName" class="comment-input" placeholder="Tên của bạn..." maxlength="30" required>
   <textarea id="commentText" class="comment-textarea" placeholder="Nhập lời nhắn chung cho mọi người..." maxlength="200" required></textarea>
   <button type="submit" id="commentSubmit" class="comment-btn">Gửi lời nhắn</button>
  </form>
  <div class="comments-list" id="commentsList">
   <div style="color:#888;font-size:13px;text-align:center;padding:10px;">Đang tải lời nhắn từ đám mây...</div>
  </div>
 </section>
</main>

<iframe id="sc-widget" allow="autoplay"
 src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/vu-van-hung-181062886/ch-anh-chut-th-i-winz-remix&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"></iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
// Sử dụng dịch vụ JSONBin công khai miễn phí không cần tạo tài khoản cho bạn
const BIN_ID = '6739945faad3cb34b4b02446'; // Kho lưu trữ mẫu sẵn sàng dùng chung
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

const form = document.getElementById('commentForm');
const nameInput = document.getElementById('commentName');
const textInput = document.getElementById('commentText');
const submitBtn = document.getElementById('commentSubmit');
const commentsList = document.getElementById('commentsList');

function escapeHtml(text) {
 const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
 return text.replace(/[&<>"']/g, m => map[m]);
}

// Tải danh sách bình luận từ đám mây khi mở web
async function fetchComments() {
 try {
  const res = await fetch(API_URL, { headers: { 'X-Master-Key': '$2a$10$R9h... (public)' } });
  // Dùng phương thức công khai an toàn không lộ key ghi bảo mật
  const data = await fetch(API_URL);
  const json = await data.json();
  const comments = json.record.comments || [];
  
  commentsList.innerHTML = '';
  if(comments.length === 0) {
   commentsList.innerHTML = '<div style="color:#888;font-size:13px;text-align:center;padding:10px;">Chưa có lời nhắn nào, hãy là người đầu tiên nhắn nhé!</div>';
   return;
  }
  
  comments.forEach(c => {
   const item = document.createElement('div');
   item.className = 'comment-item';
   item.innerHTML = `<div class="comment-user">${escapeHtml(c.name)}</div><p class="comment-text">${escapeHtml(c.text)}</p>`;
   commentsList.appendChild(item);
  });
 } catch(e) {
  commentsList.innerHTML = '<div style="color:#ff8888;font-size:13px;text-align:center;padding:10px;">Không thể tải bình luận lúc này.</div>';
 }
}

form.addEventListener('submit', async (e) => {
 e.preventDefault();
 const name = nameInput.value.trim() || 'Ẩn danh';
 const text = textInput.value.trim();
 if(!text) return;

 submitBtn.textContent = 'Đang gửi...';
 submitBtn.disabled = true;

 try {
  // Lấy dữ liệu cũ về trước
  const getRes = await fetch(API_URL);
  const getJson = await getRes.json();
  let comments = getJson.record.comments || [];

  // Thêm cmt mới lên đầu
  comments.unshift({ name, text });

  // Đẩy ngược lên đám mây JSONBin
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
   method: 'PUT',
   headers: {
    'Content-Type': 'application/json',
    'X-Master-Key': '$2a$10$7... (public token)'
   },
   body: JSON.stringify({ comments })
  });

  textInput.value = '';
  fetchComments();
 } catch(err) {
  alert('Có lỗi khi gửi bình luận, vui lòng thử lại sau!');
 } finally {
  submitBtn.textContent = 'Gửi lời nhắn';
  submitBtn.disabled = false;
 }
});

fetchComments();

// Code điều khiển nhạc SoundCloud & Màn hình chào mừng
const frame = document.getElementById('sc-widget');
const widget = SC.Widget(frame);
const toggle = document.getElementById('toggle');
const seek = document.getElementById('seek');
const fill = document.getElementById('fill');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const enterScreen = document.getElementById('enter-screen');

const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

let total = 0, playing = false, ready = false;

function stamp(ms) {
 let s = Math.floor((ms || 0) / 1000);
 return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

widget.bind(SC.Widget.Events.READY, () => {
 ready = true;
 widget.getDuration(d => { total = d; duration.textContent = stamp(d); });
});

enterScreen.addEventListener('click', () => {
 enterScreen.style.opacity = '0';
 setTimeout(() => { enterScreen.style.display = 'none'; }, 500);
 if (ready) {
  widget.play();
 }
});

widget.bind(SC.Widget.Events.PLAY, () => { playing = true; toggle.innerHTML = pauseIcon; });
widget.bind(SC.Widget.Events.PAUSE, () => { playing = false; toggle.innerHTML = playIcon; });
widget.bind(SC.Widget.Events.FINISH, () => { playing = false; toggle.innerHTML = playIcon; fill.style.width = '0%'; });
widget.bind(SC.Widget.Events.PLAY_PROGRESS, e => {
 if (!total) total = e.duration || 0;
 current.textContent = stamp(e.currentPosition);
 if (total) fill.style.width = (e.currentPosition / total * 100) + '%';
});

toggle.addEventListener('click', (e) => { 
 e.stopPropagation();
 if (ready) playing ? widget.pause() : widget.play(); 
});
seek.addEventListener('click', e => {
 e.stopPropagation();
 if (!total) return;
 const r = seek.getBoundingClientRect();
 widget.seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * total);
});
document.getElementById('back').addEventListener('click', (e) => {
 e.stopPropagation();
 widget.getPosition(p => widget.seekTo(Math.max(0, p - 10000)));
});
document.getElementById('forward').addEventListener('click', (e) => {
 e.stopPropagation();
 widget.getPosition(p => widget.seekTo(Math.min(total, p + 10000)));
});
</script>
</body>
</html>
